<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heetae Kim — Portfolio</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    .container { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
    @media (max-width: 720px) { .container { padding: 0 20px; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Button.jsx"></script>
  <script type="text/babel" src="Marquee.jsx"></script>
  <script type="text/babel" src="ProjectTile.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="HomeScreen.jsx"></script>
  <script type="text/babel" src="WorkIndex.jsx"></script>
  <script type="text/babel" src="CaseStudy.jsx"></script>
  <script type="text/babel" src="AboutScreen.jsx"></script>
  <script type="text/babel" src="ContactScreen.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [screen, setScreen] = useState("home");
      const [caseId, setCaseId] = useState(1);

      const navigate = (id) => {
        if (id === "writing") id = "home"; // not implemented; bounce home
        setScreen(id);
        window.scrollTo({ top: 0, behavior: "instant" });
      };
      const openCase = (id) => { setCaseId(id); setScreen("case"); window.scrollTo({ top: 0, behavior: "instant" }); };

      return (
        <div data-screen-label={
          screen === "home" ? "01 Home" :
          screen === "work" ? "02 Work index" :
          screen === "case" ? "03 Case study" :
          screen === "about" ? "04 About" : "05 Contact"
        }>
          <div className="container">
            <Header active={screen} onNav={navigate}/>
            {screen === "home"    && <HomeScreen onOpenWork={()=>navigate("work")} onOpenCase={openCase}/>}
            {screen === "work"    && <WorkIndex onOpenCase={openCase} onBack={()=>navigate("home")}/>}
            {screen === "case"    && <CaseStudy projectId={caseId} onBack={()=>navigate("work")}/>}
            {screen === "about"   && <AboutScreen/>}
            {screen === "contact" && <ContactScreen/>}
            <Footer/>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
