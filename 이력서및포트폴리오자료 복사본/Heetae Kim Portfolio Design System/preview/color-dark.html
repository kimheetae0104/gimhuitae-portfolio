<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Dark</title>
<link rel="stylesheet" href="_card.css"></head>
<body data-theme="dark">
<div class="card" style="background:#100E0A; color:#F2EDE2; border:1px solid rgba(242,237,226,.16);">
  <div style="font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#8A8170; margin-bottom:14px;">AFTER HOURS · DARK VARIANT</div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
    <div><div style="height:64px; background:#100E0A; border:1px solid #5C5447;"></div><div style="font-family:var(--font-mono); font-size:10px; color:#8A8170; margin-top:6px;">--bg</div></div>
    <div><div style="height:64px; background:#15120D; border:1px solid #5C5447;"></div><div style="font-family:var(--font-mono); font-size:10px; color:#8A8170; margin-top:6px;">--bg-soft</div></div>
    <div><div style="height:64px; background:#1A1611; border:1px solid #5C5447;"></div><div style="font-family:var(--font-mono); font-size:10px; color:#8A8170; margin-top:6px;">--surface</div></div>
    <div><div style="height:64px; background:#F26A4D;"></div><div style="font-family:var(--font-mono); font-size:10px; color:#8A8170; margin-top:6px;">--accent-400</div></div>
  </div>
  <div style="margin-top:14px; padding-top: 12px; border-top:1px solid rgba(242,237,226,.16); font-size:14px; color:#C4BCA9;">
    Bone on roasted black. Accent shifts one stop brighter. <span style="color:#F26A4D;">Links keep their warmth →</span>
  </div>
</div>
</body></html>
