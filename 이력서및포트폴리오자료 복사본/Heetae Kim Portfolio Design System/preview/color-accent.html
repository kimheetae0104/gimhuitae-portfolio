<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Accent</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="tag" style="margin-bottom:14px;">ACCENT · VERMILLION · USED SPARINGLY</div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px;">
    <div><div style="height:72px; background:#C5341E;"></div><div class="code" style="margin-top:6px;">600 · DEEP</div><div class="code" style="color:var(--fg-2);">#C5341E</div></div>
    <div><div style="height:72px; background:#E04323;"></div><div class="code" style="margin-top:6px;">500 · BASE</div><div class="code" style="color:var(--fg-2);">#E04323</div></div>
    <div><div style="height:72px; background:#F26A4D;"></div><div class="code" style="margin-top:6px;">400 · SOFT</div><div class="code" style="color:var(--fg-2);">#F26A4D</div></div>
    <div><div style="height:72px; background:#FCE2DB; border:1px solid var(--rule);"></div><div class="code" style="margin-top:6px;">100 · TINT</div><div class="code" style="color:var(--fg-2);">#FCE2DB</div></div>
  </div>
  <div style="font-size:14px; color:var(--fg-2); border-top:1px solid var(--rule); padding-top: 12px;">
    Used for <a href="#" style="color:#C5341E;">links</a>, focus rings, the brackets in <span style="color:#E04323; font-family:var(--font-mono); font-weight:700;">[ HK ]</span>, and one piece of selected text per page. <em>Not</em> for buttons.
  </div>
</div>
</body></html>
