<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="tag" style="margin-bottom:18px;">FORM · UNDERLINE DEFAULT · BORDER ON FOCUS</div>
  <div style="display:grid; gap: 14px; max-width: 460px;">
    <label style="display:grid; gap:4px;">
      <span class="meta">NAME</span>
      <input value="Heetae Kim" style="font-family:var(--font-sans); font-size:16px; padding: 8px 0; background:transparent; border:0; border-bottom:1px solid #0E0E10; color:#0E0E10; outline:none;"/>
    </label>
    <label style="display:grid; gap:4px;">
      <span class="meta">EMAIL</span>
      <input value="hello@heetae.kim" style="font-family:var(--font-mono); font-size:14px; padding: 10px 12px; background:#FFFFFF; border:1px solid #0E0E10; color:#0E0E10; outline:none; box-shadow: 0 0 0 3px #FCE2DB;"/>
      <span class="code" style="color: #C5341E;">FOCUSED — accent ring, full hairline border</span>
    </label>
    <label style="display:grid; gap:4px;">
      <span class="meta">MESSAGE</span>
      <textarea placeholder="짧게 적어주세요…" rows="2" style="font-family:var(--font-sans); font-size:15px; padding: 8px 0; background:transparent; border:0; border-bottom:1px solid rgba(14,14,16,.16); color:#0E0E10; outline:none; resize:none;"></textarea>
    </label>
  </div>
</div>
</body></html>
