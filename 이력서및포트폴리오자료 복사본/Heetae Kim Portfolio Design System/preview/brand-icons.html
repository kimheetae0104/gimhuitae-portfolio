<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="tag" style="margin-bottom:14px;">ICONOGRAPHY · UNICODE FIRST · LUCIDE WHEN NEEDED</div>
  <div style="display:flex; gap: 28px; align-items:center; font-family:var(--font-mono); font-size:32px; color:#0E0E10;">
    <span title="forward">→</span>
    <span title="external">↗</span>
    <span title="em dash">—</span>
    <span title="middle dot">·</span>
    <span title="close">✕</span>
    <span title="section">§</span>
    <span title="number">№</span>
    <span title="dot" style="color:#E04323;">●</span>
  </div>
  <div style="height:1px; background: rgba(14,14,16,.16); margin: 16px 0;"></div>
  <div style="display:flex; gap:22px; align-items:center;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span class="code" style="margin-left:auto;">Lucide · 1.5px stroke · 22px box</span>
  </div>
</div>
</body></html>
