<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Paper</title>
<link rel="stylesheet" href="_card.css"></head>

    <div><div style="height:88px; background:#EFEFF1; border:1px solid var(--rule);"></div><div class="code" style="margin-top:6px;">--paper-200</div><div class="code" style="color:var(--fg-2);">#EFEFF1</div></div>
    <div><div style="height:88px; background:#E2E2E5; border:1px solid var(--rule);"></div><div class="code" style="margin-top:6px;">--paper-300</div><div class="code" style="color:var(--fg-2);">#E2E2E5</div></div>
  </div>
</div>
</body></html>
