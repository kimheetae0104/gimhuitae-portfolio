<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Semantic</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="tag" style="margin-bottom:14px;">SEMANTIC ROLES · FG / BG / RULE</div>
  <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap: 10px 18px; font-size: 13px;">
    <div style="display:flex; align-items:center; gap:10px;"><span style="width:24px; height:24px; background:#0E0E10; border:1px solid var(--rule);"></span><span class="code">--fg-1 · primary text</span></div>
    <div style="display:flex; align-items:center; gap:10px;"><span style="width:24px; height:24px; background:#FFFFFF; border:1px solid var(--rule);"></span><span class="code">--bg · paper</span></div>
    <div style="display:flex; align-items:center; gap:10px;"><span style="width:24px; height:24px; background:#2F2F33; border:1px solid var(--rule);"></span><span class="code">--fg-2 · secondary</span></div>
    <div style="display:flex; align-items:center; gap:10px;"><span style="width:24px; height:24px; background:#F7F7F8; border:1px solid var(--rule);"></span><span class="code">--bg-soft · section</span></div>
    <div style="display:flex; align-items:center; gap:10px;"><span style="width:24px; height:24px; background:#6B6B72; border:1px solid var(--rule);"></span><span class="code">--fg-3 · meta</span></div>
    <div style="display:flex; align-items:center; gap:10px;"><span style="width:24px; height:24px; background:#EFEFF1; border:1px solid var(--rule);"></span><span class="code">--bg-mute · cards</span></div>
    <div style="display:flex; align-items:center; gap:10px;"><span style="width:24px; height:24px; background:#94949C; border:1px solid var(--rule);"></span><span class="code">--fg-4 · hint</span></div>
    <div style="display:flex; align-items:center; gap:10px;"><span style="width:24px; height:24px; background:#E04323;"></span><span class="code">--link · accent</span></div>
  </div>
</div>
</body></html>
