<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Project Tile</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">

  <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 18px;">
    <div>

        <span style="position:absolute; top:10px; left:10px; font-family:var(--font-mono); font-size:10px; letter-spacing:.18em; color:#2F2F33;">№ 04</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:10px;">
        <div style="font-size:16px; font-weight:600;">Notebook for one</div>
        <span class="meta">2024</span>
      </div>
      <div class="meta" style="margin-top:2px;">PRODUCT · ENG</div>
    </div>
    <div>
      <div style="aspect-ratio: 4/5; background:#0E0E10; position:relative; border:1px solid #0E0E10;">
        <span style="position:absolute; top:10px; left:10px; font-family:var(--font-mono); font-size:10px; letter-spacing:.18em; color:#94949C;">№ 05</span>
        <span style="position:absolute; bottom:10px; right:10px; color:#E04323; font-family:var(--font-mono); font-weight:700; font-size: 28px;">●</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:10px;">
        <div style="font-size:16px; font-weight:600;">소리 일기 <span style="color:var(--fg-3); font-weight:400;">(sound journal)</span></div>
        <span class="meta">2023</span>
      </div>
      <div class="meta" style="margin-top:2px;">RESEARCH · WRITING</div>
    </div>
  </div>
</div>
</body></html>
