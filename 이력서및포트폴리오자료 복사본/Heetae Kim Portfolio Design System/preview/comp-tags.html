<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Tags</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="tag" style="margin-bottom:18px;">TAGS · MONO · STATUS ONLY · NEVER FOR CATEGORY</div>
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <span style="font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; padding: 4px 10px; border-radius:999px; background:#FCE2DB; color:#C5341E;">● Shipped</span>
    <span style="font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; padding: 4px 10px; border-radius:999px; background:#EFEFF1; color:#2F2F33;">In progress</span>
    <span style="font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; padding: 4px 10px; border-radius:999px; background:#F7F7F8; color:#6B6B72; border: 1px solid rgba(14,14,16,.16);">Archived</span>
    <span style="font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; padding: 4px 10px; border-radius:999px; background:transparent; color:#6B6B72; border: 1px dashed rgba(14,14,16,.32);">Draft</span>
    <span style="font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; padding: 4px 10px; border-radius:999px; background:#0E0E10; color:#FFFFFF;">2024</span>
  </div>
  <div class="code" style="margin-top: 16px;">categories = inline mono caption · status = pill</div>
</div>
</body></html>
