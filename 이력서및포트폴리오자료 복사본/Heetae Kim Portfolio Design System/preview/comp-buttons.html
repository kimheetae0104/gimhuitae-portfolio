<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="tag" style="margin-bottom:18px;">BUTTONS · FILLED · GHOST · TEXT</div>
  <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:center;">
    <button style="background:#0E0E10; color:#FFFFFF; border:1px solid #0E0E10; font-family:var(--font-sans); font-size:14px; font-weight:500; padding: 10px 18px; cursor:pointer; letter-spacing:-0.01em;">View work →</button>
    <button style="background:transparent; color:#0E0E10; border:1px solid #0E0E10; font-family:var(--font-sans); font-size:14px; font-weight:500; padding: 10px 18px; cursor:pointer; letter-spacing:-0.01em;">Read note</button>
    <button style="background:transparent; color:#C5341E; border:0; font-family:var(--font-sans); font-size:14px; font-weight:500; padding: 10px 0; cursor:pointer; text-decoration: underline; text-underline-offset: 4px;">Open in new tab ↗</button>
    <button disabled style="background:#EFEFF1; color:#94949C; border:1px solid #E2E2E5; font-family:var(--font-sans); font-size:14px; padding: 10px 18px;">Disabled</button>
  </div>
  <div class="code" style="margin-top:18px;">filled = ink · ghost = hairline border · text = accent + underline</div>
</div>
</body></html>
