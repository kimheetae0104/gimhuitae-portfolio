<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heetae Kim — Portfolio</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    .container { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
    @media (max-width: 720px) { .container { padding: 0 20px; } }
    @media print {
      @page { size: A4; margin: 18mm 14mm; }
      body { background: #fff; }
      header[style*="position: sticky"], nav, footer { break-inside: avoid; }
      a { color: inherit !important; text-decoration: none !important; }
      section { break-inside: avoid; }
      .container { max-width: 100%; padding: 0; }
    }
    /* Selection */
    ::selection { background: var(--accent-100); color: var(--ink-900); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script>
    // Apply saved theme before paint
    try {
      const t = localStorage.getItem("hk-theme");
      if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
    } catch {}
    // Console easter egg
    console.log(
      "%c[ HK ]%c — hello, fellow inspector.\n%cyou caught me. there's a small thing waiting for you: try ↑↑↓↓←→←→BA on the page.",
      "font: 700 14px monospace; color:#E04323;",
      "font: 14px monospace; color:#0E0E10;",
      "font: 12px monospace; color:#6B6B72;"
    );
  </script>

  <script type="text/babel" src="Button.jsx"></script>
  <script type="text/babel" src="Marquee.jsx"></script>
  <script type="text/babel" src="ProjectTile.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="HomeScreen.jsx"></script>
  <script type="text/babel" src="WorkIndex.jsx"></script>
  <script type="text/babel" src="CaseStudy.jsx"></script>
  <script type="text/babel" src="AboutScreen.jsx"></script>
  <script type="text/babel" src="ContactScreen.jsx"></script>
  <script type="text/babel" src="NowScreen.jsx"></script>
  <script type="text/babel" src="WritingScreen.jsx"></script>
  <script type="text/babel" src="NotFoundScreen.jsx"></script>
  <script type="text/babel" src="CommandPalette.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [screen, setScreen] = useState("home");
      const [caseId, setCaseId] = useState(1);
      const [paletteOpen, setPaletteOpen] = useState(false);
      const [konami, setKonami] = useState(false);

      const navigate = (id, idx) => {
        if (id === "case" && typeof idx === "number") setCaseId(idx);
        setScreen(id);
        window.scrollTo({ top: 0, behavior: "instant" });
      };
      const openCase = (id) => navigate("case", id);

      // Keyboard shortcuts
      useEffect(() => {
        const KONAMI = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
        let buf = [];
        const onKey = (e) => {
          // ⌘K / Ctrl+K
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
            e.preventDefault(); setPaletteOpen(true); return;
          }
          // ⇧⌘D dark mode
          if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "d") {
            e.preventDefault();
            const cur = document.documentElement.getAttribute("data-theme");
            const next = cur === "dark" ? "" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            try { localStorage.setItem("hk-theme", next); } catch {}
            return;
          }
          // 404 demo: type "404"
          if (e.key === "4" || e.key === "0") {
            // ignore; not implemented
          }
          // Konami code
          buf.push(e.key);
          if (buf.length > KONAMI.length) buf = buf.slice(-KONAMI.length);
          if (buf.length === KONAMI.length && buf.every((k,i)=>k===KONAMI[i])) {
            setKonami(true); setTimeout(()=>setKonami(false), 4500); buf = [];
          }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);

      const label =
        screen === "home" ? "01 Home" :
        screen === "work" ? "02 Work index" :
        screen === "case" ? "03 Case study" :
        screen === "about" ? "04 About" :
        screen === "contact" ? "05 Contact" :
        screen === "writing" ? "06 Writing" :
        screen === "now" ? "07 Now" :
        screen === "404" ? "08 Not found" : "??";

      return (
        <div data-screen-label={label}>
          <div className="container">
            <HeaderV2 active={screen} onNav={navigate} onOpenPalette={()=>setPaletteOpen(true)}/>
            {screen === "home"    && <HomeScreen onOpenWork={()=>navigate("work")} onOpenCase={openCase}/>}
            {screen === "work"    && <WorkIndex onOpenCase={openCase} onBack={()=>navigate("home")}/>}
            {screen === "case"    && <CaseStudy projectId={caseId} onBack={()=>navigate("work")}/>}
            {screen === "about"   && <AboutScreen/>}
            {screen === "contact" && <ContactScreen/>}
            {screen === "writing" && <WritingScreen/>}
            {screen === "now"     && <NowScreen/>}
            {screen === "404"     && <NotFoundScreen onHome={()=>navigate("home")}/>}
            <Footer onTrigger404={()=>navigate("404")}/>
          </div>
          <CommandPalette open={paletteOpen} onClose={()=>setPaletteOpen(false)} onNav={navigate}/>
          {konami && (
            <div style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 300, display: "grid", placeItems: "center" }}>
              <div style={{ fontFamily: "var(--font-mono)", fontSize: 96, fontWeight: 700, color: "var(--accent-500)", textShadow: "0 0 40px rgba(224,67,35,.4)", animation: "konami 4s ease" }}>
                ★ HI THERE ★
              </div>
              <style>{`@keyframes konami { 0%,100%{opacity:0; transform:scale(.9)} 20%,80%{opacity:1; transform:scale(1)} }`}</style>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
