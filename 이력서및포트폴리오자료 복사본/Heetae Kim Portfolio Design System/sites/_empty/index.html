<!DOCTYPE html>
<html lang="ko">
<head>

<title>Coming soon — 빈 슬롯</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { display:grid; place-items:center; min-height: 100vh; background: var(--bg-soft); }

<body>
  <div class="wrap">
    <div class="meta" style="margin-bottom:16px;"><span class="dot"></span>EMPTY SLOT · WAITING FOR WORK</div>

    <p style="font-size:16px; color: var(--fg-2); max-width: 36ch; margin: 0 auto;">곧 어떤 작업이 여기에 들어올 예정입니다. <span style="color: var(--fg-3);">A new project will move in soon.</span></p>
  </div>
