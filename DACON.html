<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>Dacon — 스마트 창고 출고 지연 예측</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="shared/tokens.css"/>
<link rel="stylesheet" href="shared/slide.css"/>
<script src="shared/deck-stage.js?v=5" defer></script>
<style>
:root { --cn: #6D28D9; }

.cn-eyebrow {
  font-family: var(--font-mono);
  font-size: 24px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--cn);
  margin-bottom: 18px;
}
.cn-title {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 64px;
  line-height: 1.08;
  letter-spacing: -0.03em;
  color: var(--fg-1);
  margin: 0 0 18px;
}
.cn-sub {
  font-family: var(--font-sans);
  font-size: 28px;
  line-height: 1.6;
  color: var(--fg-2);
  max-width: 80ch;
  margin: 0;
}
.cn-sub strong { color: var(--cn); font-weight: 700; }

.cn-imgs {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 22px;
  margin-top: 44px;
  min-height: 0;
}
.cn-fig {
  border: 1px solid var(--rule-soft);
  border-radius: var(--r-3);
  overflow: hidden;
  background: #fff;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.cn-fig img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  flex: 1;
  display: block;
  min-height: 0;
}
.cn-cap {
  font-family: var(--font-mono);
  font-size: 16px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-3);
  padding: 13px 16px;
  border-top: 1px solid var(--rule-soft);
  background: var(--paper-50);
}

/* ── 모바일 반응형 (deck-stage responsive) ── */
@media (max-width: 768px) {
  section.slide { padding: 70px 20px 36px; height: auto; overflow: visible; }
  .top-rule { font-size: 12px; padding-bottom: 16px; }
  .cn-eyebrow { font-size: 13px; margin-bottom: 12px; }
  .cn-title { font-size: 32px; }
  .cn-sub { font-size: 17px; max-width: none; }
  .cn-imgs { grid-template-columns: 1fr !important; gap: 16px; margin-top: 24px; }
  .cn-fig img { height: auto; max-height: 78vh; }
  .pageno, .pageno-mark { display: none; }
}
</style>
</head>
<body>

<header class="deck-header">
  <a href="index.html" class="deck-header-mark">김희태</a>
  <div style="display:flex;align-items:center;gap:10px;">
    <a href="index.html" class="deck-header-back">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
      포트폴리오
    </a>
  </div>
</header>

<deck-stage width="1920" height="1080" responsive>

  <section class="slide" data-label="Dacon">
    <div class="top-rule">
      <span>Dacon — 스마트 창고 출고 지연 예측</span>
      <span>Logistics · 2026</span>
    </div>

    <div style="margin-top:40px;">
      <p class="cn-eyebrow">Logistics · Regression · Dacon 2026</p>
      <h1 class="cn-title">스마트 창고 출고 지연 예측</h1>
      <p class="cn-sub">스마트 창고 운영 데이터로 향후 30분 평균 출고 지연을 예측한 DACON 경진대회. 4인 팀 창동아레나로 <strong>607팀 중 11위 · 상위 2%</strong> 달성.</p>
    </div>

    <div class="cn-imgs">
      <div class="cn-fig">
        <img src="dacon/certificate.webp" alt="DACON 수상 인증서"/>
        <div class="cn-cap">수상 인증서 — 11/607 · TOP 2%</div>
      </div>
      <div class="cn-fig">
        <img src="dacon/target-distribution.png" alt="타겟 분포"/>
        <div class="cn-cap">타겟 분포 (long-tail)</div>
      </div>
      <div class="cn-fig">
        <img src="dacon/corr-top20.png" alt="타겟 상관 상위 20개 피처"/>
        <div class="cn-cap">타겟 상관 상위 20개</div>
      </div>
      <div class="cn-fig">
        <img src="dacon/feature-scatter.png" alt="핵심 파생 피처 산점도"/>
        <div class="cn-cap">핵심 파생 피처 산점도</div>
      </div>
    </div>

    <a href="index.html" class="pageno-mark" style="text-decoration:none;color:inherit;">김희태</a>
    <span class="pageno">01</span>
  </section>

</deck-stage>
</body>
</html>
