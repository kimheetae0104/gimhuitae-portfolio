<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>LHV — 열풍로 발열량 예측</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="shared/tokens.css"/>
<link rel="stylesheet" href="shared/slide.css"/>
<script src="shared/deck-stage.js?v=2" defer></script>
<style>
:root { --cn: var(--accent-600); }

.cn-eyebrow {
  font-family: var(--font-mono);
  font-size: 24px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--cn);
  margin-bottom: 18px;
}
.cn-title {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 64px;
  line-height: 1.08;
  letter-spacing: -0.03em;
  color: var(--fg-1);
  margin: 0 0 18px;
}
.cn-sub {
  font-family: var(--font-sans);
  font-size: 28px;
  line-height: 1.6;
  color: var(--fg-2);
  max-width: 80ch;
  margin: 0;
}
.cn-sub strong { color: var(--cn); font-weight: 700; }

.cn-imgs {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  margin-top: 44px;
  min-height: 0;
}
.cn-fig {
  border: 1px solid var(--rule-soft);
  border-radius: var(--r-3);
  overflow: hidden;
  background: #fff;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.cn-fig img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  flex: 1;
  display: block;
  min-height: 0;
}
.cn-cap {
  font-family: var(--font-mono);
  font-size: 16px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-3);
  padding: 13px 16px;
  border-top: 1px solid var(--rule-soft);
  background: var(--paper-50);
}
</style>
</head>
<body>

<header class="deck-header">
  <a href="index.html" class="deck-header-mark">김희태</a>
  <div style="display:flex;align-items:center;gap:10px;">
    <a href="https://github.com/kimheetae0104/sesac-kaggle" target="_blank" rel="noopener noreferrer" class="deck-header-back">GitHub ↗</a>
    <a href="index.html" class="deck-header-back">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
      포트폴리오
    </a>
  </div>
</header>

<deck-stage width="1920" height="1080">

  <section class="slide" data-label="LHV">
    <div class="top-rule">
      <span>LHV — 열풍로 발열량 예측</span>
      <span>Steel · 2026</span>
    </div>

    <div style="margin-top:40px;">
      <p class="cn-eyebrow">Steel Industry · Regression · SeSAC 2026</p>
      <h1 class="cn-title">열풍로 LHV 발열량 예측</h1>
      <p class="cn-sub">열풍로 COG·BFG 혼합가스의 5분 뒤 발열량(LHV)을 예측. 측정 지연으로 보수적으로 과잉 투입하던 COG를 <strong>데이터 기반 판단</strong>으로 — Ridge RMSE 11.99 / R² 0.428.</p>
    </div>

    <div class="cn-imgs">
      <div class="cn-fig">
        <img src="lhv/img/image4-35.png" alt="상관행렬 히트맵"/>
        <div class="cn-cap">상관행렬 — 유량과 LHV</div>
      </div>
      <div class="cn-fig">
        <img src="lhv/img/image2-31.png" alt="핵심 변수 히스토그램"/>
        <div class="cn-cap">핵심 변수 분포</div>
      </div>
      <div class="cn-fig">
        <img src="lhv/img/image3-45.png" alt="SHAP 피처 중요도"/>
        <div class="cn-cap">SHAP — 피처 중요도</div>
      </div>
    </div>

    <a href="index.html" class="pageno-mark" style="text-decoration:none;color:inherit;">김희태</a>
    <span class="pageno">01</span>
  </section>

</deck-stage>
</body>
</html>
